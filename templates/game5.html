<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>Stickman vs Aliens</title>
  <link rel="stylesheet" href="../static/css/game5.css" />
</head>
<body>
  <button id="back-btn" class="back-btn">⬅ Back</button>
  <h1 class="title">Stickman vs Aliens</h1>

  <div class="game-container">
    <canvas id="game" width="900" height="600"></canvas>

    <div class="ui">
      <div class="stat">HP: <span id="hpText"></span></div>
      <div class="stat">Score: <span id="scoreText">0</span></div>
      <div class="stat">Aliens: <span id="alienCount">0</span></div>
      <div class="stat">Buffs:
        <span id="buffText">None</span>
      </div>
      <div class="hint">
        移動：方向鍵 ↑ ↓ ← →<br>
        射擊：空白鍵　瞄準：滑鼠<br>
      </div>
    </div>
  </div>

  <div class="footer">
    <button id="restartBtn">重新開始</button>
  </div>

  <script src="../static/js/game5.js"></script>
</body>
</html>
