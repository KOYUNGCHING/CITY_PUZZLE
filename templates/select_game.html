<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>選擇遊戲 - 拼圖挑戰</title>
    <link rel="stylesheet" href="../static/css/select_game.css">
</head>
<body>
    <div class="select-game-container">
        <header class="header">
            <h1>選擇要挑戰的遊戲</h1>
            <button class="back-button" onclick="window.location.href='/'">⬅ 回首頁</button>
            <!-- 如果不用 Flask，而是 home.html，就改成 'home.html' -->
        </header>

        <main class="game-grid">
            <!-- 四個正方形遊戲卡片 -->
            <div class="game-card" onclick="window.location.href='/game1'">
                <span>數獨</span>
                <small>Game 1</small>
            </div>

            <div class="game-card" onclick="window.location.href='/game2'">
                <span>消消樂</span>
                <small>Game 2</small>
            </div>

            <div class="game-card" onclick="window.location.href='/game3'">
                <span>貪吃蛇</span>
                <small>Game 3</small>
            </div>

            <div class="game-card" onclick="window.location.href='/game4'">
                <span>戰車</span>
                <small>Game 4</small>
            </div>
        </main>
    </div>
</body>
</html>
