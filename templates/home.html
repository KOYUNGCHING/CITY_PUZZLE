<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>遊戲首頁 - 拼圖挑戰</title>
  <link rel="stylesheet" href="../static/css/home.css">
</head>

<body>
  <div class="game-container">

    <!-- ===== Header ===== -->
    <header class="header">

      <!-- 個人資料卡 -->
      <div class="player-info">

        <!-- 登出鍵：左上斜外側 -->
        <button id="logout-button" class="logout-position">
          <img src="{{ url_for('static', filename='img/button/LOGOUT.png') }}"
               alt="登出"
               class="button-icon">
        </button>

        <div class="avatar-container">
          <img src="../static/img/Photo_stickers/Press2.png"
               alt="角色頭貼"
               class="avatar">
        </div>

        <div class="text-info">
          <span id="player-name">哈哈</span>
          <span id="player-score">總得分：1500</span>
        </div>
      </div>

      <!-- 右上角：排行榜 -->
      <button id="rank-button" class="top-right-button">
        <img src="{{ url_for('static', filename='img/button/RANKING.png') }}"
             alt="積分排名"
             class="button-icon">
      </button>

    </header>

    <!-- ===== 中央內容 ===== -->
    <main class="main-content">
      <!-- 預留 -->
    </main>

    <!-- ===== Footer ===== -->
    <footer class="footer">

      <!-- 左下：拼圖 -->
      <button id="puzzle-jump-button" class="bottom-left-button">
        <img src="{{ url_for('static', filename='img/button/ALL_PUZZLES.png') }}"
             alt="所有拼圖"
             class="button-icon">
      </button>

      <!-- 右下：選擇遊戲 -->
      <button id="select-game-button" class="bottom-right-button">
        <img src="{{ url_for('static', filename='img/button/GAME.png') }}"
             alt="選擇遊戲"
             class="button-icon">
      </button>

    </footer>
  </div>

  <script src="../static/js/home.js"></script>
</body>
</html>
