<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>CITY_PUZZLE - 主畫面</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS 連結 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>

<body>
<div class="screen-wrapper">

    <!-- 左上：玩家資訊 -->
    <div class="player-panel">
        <button class="back-button" onclick="goBack()">←</button>

        <div class="avatar" style="background-image: url('/static/img/ui/default_avatar.png');"></div>

        <div class="player-info">
            <div class="player-name">PLAYER_NAME</div>
            <div class="player-score">Score: 0</div>
        </div>
    </div>

    <!-- 右上：排行榜 -->
    <a class="ranking-button" href="/ranking">
        <span class="icon">👑</span>
        <span>排行榜</span>
    </a>

    <!-- 左下：貼圖 -->
    <a class="sticker-entry" href="/stickers">
        <div class="sticker-icon">🎴</div>
        <div class="sticker-label">貼圖</div>
    </a>

    <!-- 右下：進入遊戲 -->
    <button class="start-button" onclick="startGame()">
        開始遊戲
    </button>

    <!-- 中央標題 -->
    <div class="center-title">
        <h1>CITY_PUZZLE</h1>
        <p>蒐集拼圖・拯救城市・重建世界</p>
    </div>

</div>

<!-- JavaScript -->
<script src="{{ url_for('static', filename='js/index.js') }}"></script>

</body>
</html>
