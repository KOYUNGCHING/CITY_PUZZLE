<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貪吃蛇</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='game3.css') }}">
</head>
<body>
    <div class="game-wrapper">
        <button class="home-button" onclick="window.location.href='{{ url_for('home') }}'">🏠 回首頁</button>
        
        <header>
            <h1>經典貪吃蛇</h1>
            <div class="score-display">
                <p>得分: <span id="current-score">0</span></p>
                <p>最高分: <span id="high-score">0</span> (<span id="high-score-player">N/A</span>)</p>
            </div>
        </header>

        <canvas id="game-canvas"></canvas>

        <div id="game-overlay">
            <h2 id="overlay-title">點擊開始</h2>
            <p id="overlay-message">使用方向鍵 (↑↓←→) 或 W/A/S/D 控制</p>
            <button id="start-button">開始遊戲</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='game3.js') }}"></script>
</body>
</html>
