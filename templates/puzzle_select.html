<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊戲首頁 - 拼圖挑戰</title>
    <link rel="stylesheet" href="../static/css/home.css">
</head>
<body>
    <div class="game-container">
        <header class="header">
            <!-- 左上角區域：角色資訊 + 登出按鈕 (位於左下角) -->
            <div class="player-info">
                
                <div class="avatar-container">
                    <img src="avatar.png" alt="角色頭貼" class="avatar">
                    
                    <!-- 🚪 登出按鈕：位於 player-info 左斜下方 -->
                    <button id="logout-button" class="logout-corner-button">
                        <img src="../static/img/button/LOGOUT.png" alt="登出" class="button-icon-mini">
                    </button>
                </div>

                <div class="text-info">
                    <span id="player-name">記者小組</span>
                    <span id="player-score">總得分: 1500</span>
                </div>
            </div>
            
            <!-- 右上角：積分排名按鈕 -->
            <button id="rank-button" class="top-right-button">
                <img src="../static/img/button/RANKING.png" alt="積分排名" class="button-icon">
            </button>
        </header>

        <main class="main-content">
        </main>

        <footer class="footer">
            <!-- 左下角：所有拼圖按鈕 (開啟 Modal) -->
            <button id="puzzle-jump-button" class="bottom-left-button">
                <img src="../static/img/button/ALL_PUZZLES.png" alt="所有拼圖" class="button-icon">
            </button>

            <!-- 右下角：選擇遊戲按鈕 (開啟 Modal) -->
            <button id="select-game-button" class="bottom-right-button">
                <img src="../static/img/button/GAME.png" alt="選擇遊戲" class="button-icon">
            </button>
        </footer>
    </div>
    
    <!-- ============================================== -->
    <!-- ============== Puzzles Modal (拼圖選擇跳窗) ============== -->
    <!-- ============================================== -->
    <div id="puzzle-modal" class="modal-overlay hidden">
        <div class="modal-content large-modal">
            <button class="modal-close-button" data-modal-target="puzzle-modal">X</button>
            <h2 class="modal-title">🗺️ 地標拼圖挑戰</h2>
            
            <!-- 模擬地標選擇頁面的內容 (4 個地標，每個 4 塊) -->
            <div class="landmark-grid-container">
                
                <!-- 範例地標 1 -->
                <div class="landmark-group" data-landmark="taipei101">
                    <h3>臺北 101</h3>
                    <div class="puzzle-pieces-container">
                        <div class="puzzle-piece solved" data-piece="1">1/5</div>
                        <div class="puzzle-piece collecting" data-piece="2">3/5</div>
                        <div class="puzzle-piece locked" data-piece="3">0/5</div>
                        <div class="puzzle-piece locked" data-piece="4">0/5</div>
                    </div>
                </div>

                <!-- 範例地標 2 -->
                <div class="landmark-group" data-landmark="eiffel">
                    <h3>艾菲爾鐵塔</h3>
                    <div class="puzzle-pieces-container">
                        <div class="puzzle-piece locked" data-piece="1">0/5</div>
                        <div class="puzzle-piece locked" data-piece="2">0/5</div>
                        <div class="puzzle-piece locked" data-piece="3">0/5</div>
                        <div class="puzzle-piece locked" data-piece="4">0/5</div>
                    </div>
                </div>
                
                <!-- 範例地標 3 -->
                <div class="landmark-group" data-landmark="pyramid">
                    <h3>金字塔</h3>
                    <div class="puzzle-pieces-container">
                        <div class="puzzle-piece locked" data-piece="1">0/5</div>
                        <div class="puzzle-piece locked" data-piece="2">0/5</div>
                        <div class="puzzle-piece locked" data-piece="3">0/5</div>
                        <div class="puzzle-piece locked" data-piece="4">0/5</div>
                    </div>
                </div>

                <!-- 範例地標 4 -->
                <div class="landmark-group" data-landmark="liberty">
                    <h3>自由女神</h3>
                    <div class="puzzle-pieces-container">
                        <div class="puzzle-piece locked" data-piece="1">0/5</div>
                        <div class="puzzle-piece locked" data-piece="2">0/5</div>
                        <div class="puzzle-piece locked" data-piece="3">0/5</div>
                        <div class="puzzle-piece locked" data-piece="4">0/5</div>
                    </div>
                </div>
                
            </div>
            
        </div>
    </div>

    <!-- ============================================== -->
    <!-- ============== Game Select Modal (遊戲選擇跳窗) ============== -->
    <!-- ============================================== -->
    <div id="game-select-modal" class="modal-overlay hidden">
        <div class="modal-content small-modal">
            <button class="modal-close-button" data-modal-target="game-select-modal">X</button>
            <h2 class="modal-title">🕹️ 選擇遊戲</h2>
            
            <div class="game-options">
                <a href="/game/1" class="game-link">遊戲 1: 射擊挑戰</a>
                <a href="/game/2" class="game-link">遊戲 2: 記憶配對</a>
                <a href="/game/3" class="game-link">遊戲 3: 貪吃蛇</a>
                <a href="/game/4" class="game-link">遊戲 4: 迷宮探索</a>
            </div>
        </div>
    </div>

    <script src="../static/js/home.js"></script>
</body>
</html>
